# Render's free plan puts the backend to sleep after 15 minutes without
# visits (the next visit then waits ~1 minute), and Aiven can power off an
# idle free database. Visiting the API every few minutes keeps both awake.
name: Mantener despierta la app

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visitar el backend (también consulta la base)
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://halloween-api-kefa.onrender.com/api/game
