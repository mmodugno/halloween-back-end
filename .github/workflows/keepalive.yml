# Render's free plan puts the backend to sleep after 15 minutes without
# visits (and a sleeping backend uses no free hours). Aiven can power off an
# idle free database. This workflow balances both:
#  - once a day until the party: keeps the database alive and costs only
#    ~15 minutes of Render hours per day;
#  - every 5 minutes around the party so nobody waits for a cold start.
# Times are UTC (Argentina is UTC-3). Change the party dates here if needed.
name: Mantener despierta la app

on:
  schedule:
    # Every day at 12:00 (Argentina).
    - cron: "0 15 * * *"
    # Party: October 30 and 31, all day.
    - cron: "*/5 * 30,31 10 *"
    # Until 09:00 (Argentina) on November 1.
    - cron: "*/5 0-11 1 11 *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visitar el backend (también consulta la base)
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://halloween-api-kefa.onrender.com/api/game
